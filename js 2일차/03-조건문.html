<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>

  const name = 'bogeom'
  // name이 admin일 경우 "관리자님 환영해요", name이 customer일 경우 "고객님 환영해요", 그 밖의 경우 "반갑습니다 name님" 출력
  // python에서는 들여쓰기로 코드를 구분
  // js에서는 중괄호로 코드 구분
  if (name === 'admin') {
    console.log('관리자님 환영해요')
  } else if (name === 'customer') {
    console.log('고객님 확인해요')
  } else { // ` (백틱) , $ {}
    console.log(`반갑습니다. ${name}님`)
  }

</script>
</body>

</html>

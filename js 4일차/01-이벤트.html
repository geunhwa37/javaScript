
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button id="btn">버튼</button>

  <script>
    // 1. querySelector
    const btn = document.querySelector('#btn')

    // 2. 콜백 함수
    const detectClick = function (event) {
      console.log(event)
      console.log(event.currentTarget) // btn 요소(태그)
      console.log(this) // btn 요소(태그)
    }

    // 3. 이벤트 리스너
    // 이벤트 리스너 : 어떤 특정 상황을 감지했을때(예: 클릭) 특정 함수를 실행하겠다.
    // btn을 클릭했을때 detectClick함수를 실행하겠다.
    btn.addEventListener('click', detectClick)

  </script>
</body>

</html>

<!-- axios.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>


<!-- AJAX의 주된 목적은 "새로고침 없이 비동기적으로 서버와 통신하기 위해서" 입니다. -->
<!-- Axios는 AJAX를 쉽게 사용하게 해주는 '라이브러리'입니다 -->
<body>

  <!-- axios CDN -->
  <!-- axios 사용할 수 있는 2가지 방법 1.node.js설치해서 npm명령어로 설치 2. CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>

    // Promise
    // 방법 1. Promise객체를 변수에 할당(promiseObj)
    const promiseObj = axios({
      method: 'get', // HTPP method (get, poset, put, delete)
      url: 'https://api.thecatapi.com/v1/images/search' // 고양이 사진 저작권 없는
    })

    // Promise는 then / catch로 처리
    // .then() : 요청이 성공 했을 때
    // .catch() : 요청이 실패 했을 때
    promiseObj
      .then((response) => {
        console.log(response.data)
      })
      .catch((error) => {
        console.log(error)
      })

    // '보검이형 하이' 먼저 출력이 되었다.
    // console.log(response.data) ---> 서버에 get요청 보내고, 응답이 도착했때 실행
    // 비동기 통신
    console.log('보검이형 하이')

    // console.log(promiseObj) // Promise object


    // 방법 2. 변수 선언 없이 Promise객체를 바로처리

    axios({
      method: 'get',
      url: 'https://api.thecatapi.com/v1/images/search'
    })
      .then((response) => {
        console.log(response.data)
      })
      .catch((error) => {
        console.log(error)
      })

    console.log('안녕하세요')

    // 결론 : 프론트에서 서버로 요청(request)을 보내고 데이터를 응답(response)받는데 시간이 걸리기 때문에
    // 그동안 다른 코드가 실행 될수 있게끔 비동기 통신을 사용한다.

  </script>

</body>

</html>
